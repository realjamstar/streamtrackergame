<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Music Tracker 🌙</title>
    <!-- ฟอนท์ Pixel และ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ไลบรารีสำหรับแคปเจอร์ภาพการ์ด -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="night-pastel-bg text-slate-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center p-6 night-pastel-card rounded-3xl shadow-2xl max-w-md w-full border border-purple-500/30">
        <h1 class="text-xl font-bold mb-3 pixel-title text-purple-200">✨ SLEEPY INSOMNIA ✨</h1>
        
        <!-- ส่วนแสดงข้อมูลโปรไฟล์ -->
        <div id="user-profile" class="hidden flex items-center justify-center space-x-3 mb-4 bg-purple-950/40 p-3 rounded-2xl border border-purple-400/20">
            <img id="user-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-pink-300 object-cover shadow-sm">
            <span id="user-name" class="font-semibold text-pink-200 text-sm"></span>
        </div>

        <p id="status-text" class="text-purple-300 text-sm mb-6 font-light">กรุณาล็อกอินเข้าสู่ระบบ Spotify ก่อนเริ่มใช้งาน</p>

        <!-- ปุ่ม Login Spotify -->
        <button id="login-btn" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-2.5 px-6 rounded-full transition duration-200 shadow-lg shadow-purple-500/20 text-sm">
            Login with Spotify
        </button>

        <!-- หน้าที่ 1: ส่วนเลือกตัวการ์ตูนทั้ง 6 ตัว -->
        <div id="character-select-section" class="hidden mt-4 space-y-4">
            <p class="text-xs font-semibold text-purple-200">เลือกตัวละครเพื่อเข้าสู่การ์ดจำศีล:</p>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="SHOTARO" data-img="https://img1.pic.in.th/images/173a91148cd9ea8f88.jpg">
                    <img src="https://img1.pic.in.th/images/173a91148cd9ea8f88.jpg" alt="SHOTARO" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">SHOTARO</span>
                </button>
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="EUNSEOK" data-img="https://img1.pic.in.th/images/1835df146bda79054b.jpg">
                    <img src="https://img1.pic.in.th/images/1835df146bda79054b.jpg" alt="EUNSEOK" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">EUNSEOK</span>
                </button>
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="SUNGCHAN" data-img="https://img2.pic.in.th/19a60c06b76ff804b8.jpg">
                    <img src="https://img2.pic.in.th/19a60c06b76ff804b8.jpg" alt="SUNGCHAN" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">SUNGCHAN</span>
                </button>
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="WONBIN" data-img="https://img2.pic.in.th/2059f6bc36db45904f.jpg">
                    <img src="https://img2.pic.in.th/2059f6bc36db45904f.jpg" alt="WONBIN" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">WONBIN</span>
                </button>
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="SOHEE" data-img="https://img2.pic.in.th/21c445acad3d55acef.jpg">
                    <img src="https://img2.pic.in.th/21c445acad3d55acef.jpg" alt="SOHEE" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">SOHEE</span>
                </button>
                <button type="button" class="char-select-btn p-3 rounded-2xl bg-purple-950/40 border-2 border-purple-800/50 hover:border-pink-400 transition flex flex-col items-center space-y-2 group" data-name="ANTON" data-img="https://img1.pic.in.th/images/22b17bcedf8418b5ec.jpg">
                    <img src="https://img1.pic.in.th/images/22b17bcedf8418b5ec.jpg" alt="ANTON" class="w-16 h-16 object-contain rounded-xl group-hover:scale-105 transition">
                    <span class="text-xs font-bold text-purple-200 pixel-subtitle">ANTON</span>
                </button>
            </div>
        </div>

        <!-- หน้าที่ 2: ส่วนแสดงผลการ์ดตามตัวละครที่เลือก -->
        <div id="player-section" class="hidden mt-4 space-y-4">
            
            <button id="back-to-select-btn" class="text-xs text-purple-300 hover:text-pink-300 underline mb-1">
                ← กลับไปเลือกตัวละครอื่น
            </button>

            <div class="bg-purple-950/20 p-2.5 rounded-xl border border-purple-500/10">
                <p class="text-[11px] text-purple-300">กำลังฟังเพลง:</p>
                <p id="track-name" class="text-sm font-semibold text-pink-300 truncate">-</p>
            </div>

            <!-- กล่องการ์ดที่จะถูกบันทึกภาพด้วย html2canvas -->
            <div id="share-card-container" class="night-pastel-inner p-4 rounded-2xl border border-purple-500/20 space-y-4">
                
                <div class="relative inline-block my-1 w-full max-w-[280px] mx-auto">
                    <img id="selected-char-img" src="" alt="Selected Character" class="w-full h-auto object-contain rounded-xl shadow-md">
                    
                    <div id="pixel-timer-box" class="pixel-timer-container">
                        <p id="sleep-timer" class="pixel-font text-yellow-200">00:00:00</p>
                    </div>
                </div>

                <button id="share-x-btn" class="w-full bg-slate-900 hover:bg-black border border-purple-500/30 text-white font-bold py-2.5 px-4 rounded-full transition duration-200 flex items-center justify-center space-x-2 text-xs shadow-md">
                    <span>𝕏 บันทึกภาพการ์ดและแชร์ไปที่ X</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
