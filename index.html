<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy Music Tracker 🌙</title>
    <!-- นำเข้าฟอนท์ Pixel และ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="night-pastel-bg text-slate-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center p-6 night-pastel-card rounded-3xl shadow-2xl max-w-lg w-full border border-purple-500/30">
        <h1 class="text-xl font-bold mb-3 pixel-title text-purple-200">✨ SLEEPY INSOMNIA ✨</h1>
        
        <!-- ส่วนแสดงข้อมูลโปรไฟล์ (ซ่อนไว้ก่อนจนกว่าจะล็อกอิน) -->
        <div id="user-profile" class="hidden flex items-center justify-center space-x-3 mb-4 bg-purple-950/40 p-3 rounded-2xl border border-purple-400/20">
            <img id="user-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-pink-300 object-cover shadow-sm">
            <span id="user-name" class="font-semibold text-pink-200 text-sm"></span>
        </div>

        <p id="status-text" class="text-purple-300 text-sm mb-6 font-light">กรุณาล็อกอินเข้าสู่ระบบ Spotify ก่อนเริ่มใช้งาน</p>

        <!-- ปุ่ม Login Spotify -->
        <button id="login-btn" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold py-2.5 px-6 rounded-full transition duration-200 shadow-lg shadow-purple-500/20 text-sm">
            Login with Spotify
        </button>

        <!-- ส่วนแสดงผลเมื่อเข้าสู่ระบบแล้ว -->
        <div id="player-section" class="hidden mt-6 space-y-5">
            
            <!-- ส่วนเลือกตัวละคร 6 ตัว -->
            <div class="space-y-2">
                <p class="text-xs font-semibold text-purple-300">เลือกตัวละครคุมนอน (เลือกได้ 1 ตัว):</p>
                <div class="grid grid-cols-3 gap-2">
                    <!-- 1. SHOTARO -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="SHOTARO" data-img="https://img1.pic.in.th/images/173a91148cd9ea8f88.jpg">
                        <img src="https://img1.pic.in.th/images/173a91148cd9ea8f88.jpg" alt="SHOTARO" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">SHOTARO</span>
                    </button>
                    <!-- 2. EUNSEOK -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="EUNSEOK" data-img="https://img1.pic.in.th/images/1835df146bda79054b.jpg">
                        <img src="https://img1.pic.in.th/images/1835df146bda79054b.jpg" alt="EUNSEOK" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">EUNSEOK</span>
                    </button>
                    <!-- 3. SUNGCHAN -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="SUNGCHAN" data-img="https://img2.pic.in.th/19a60c06b76ff804b8.jpg">
                        <img src="https://img2.pic.in.th/19a60c06b76ff804b8.jpg" alt="SUNGCHAN" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">SUNGCHAN</span>
                    </button>
                    <!-- 4. WONBIN -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="WONBIN" data-img="https://img2.pic.in.th/2059f6bc36db45904f.jpg">
                        <img src="https://img2.pic.in.th/2059f6bc36db45904f.jpg" alt="WONBIN" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">WONBIN</span>
                    </button>
                    <!-- 5. SOHEE -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="SOHEE" data-img="https://img2.pic.in.th/21c445acad3d55acef.jpg">
                        <img src="https://img2.pic.in.th/21c445acad3d55acef.jpg" alt="SOHEE" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">SOHEE</span>
                    </button>
                    <!-- 6. ANTON -->
                    <button type="button" class="char-btn p-2 rounded-xl bg-purple-950/30 border-2 border-purple-800/40 hover:border-pink-400 transition flex flex-col items-center space-y-1" data-name="ANTON" data-img="https://img1.pic.in.th/images/22b17bcedf8418b5ec.jpg">
                        <img src="https://img1.pic.in.th/images/22b17bcedf8418b5ec.jpg" alt="ANTON" class="w-12 h-12 object-contain rounded">
                        <span class="text-[10px] font-bold text-purple-200">ANTON</span>
                    </button>
                </div>
            </div>

            <!-- ส่วนแสดงเพลงที่กำลังฟัง -->
            <div class="bg-purple-950/20 p-2.5 rounded-xl border border-purple-500/10">
                <p class="text-[11px] text-purple-300">กำลังฟังเพลง:</p>
                <p id="track-name" class="text-sm font-semibold text-pink-300 truncate">-</p>
            </div>

            <!-- กล่องแสดงการ์ดตัวละคร พร้อมช่องเวลา Pixel Font ทับบนช่องขาว -->
            <div class="night-pastel-inner p-4 rounded-2xl border border-purple-500/20 space-y-4">
                
                <div class="relative inline-block my-1 w-full max-w-[260px] mx-auto">
                    <!-- รูปการ์ดตัวละคร (รวมข้อความกราฟิกแล้ว) -->
                    <img id="selected-char-img" src="https://img1.pic.in.th/images/173a91148cd9ea8f88.jpg" alt="Selected Character" class="w-full h-auto object-contain rounded-xl shadow-md">
                    
                    <!-- ช่องเวลา Pixel Font วางทับช่องสีขาวบนการ์ด -->
                    <div class="pixel-timer-container pos-shotaro">
                        <p id="sleep-timer" class="pixel-font text-yellow-200">00:00:00</p>
                    </div>
                </div>

                <!-- ปุ่มแชร์ไป X (Twitter) อยู่ส่วนล่างสุด -->
                <button id="share-x-btn" class="w-full bg-slate-900 hover:bg-black border border-purple-500/30 text-white font-bold py-2.5 px-4 rounded-full transition duration-200 flex items-center justify-center space-x-2 text-xs shadow-md">
                    <span>𝕏 แชร์สถิตินอนหลับไปที่ X</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ES Module สำหรับเชื่อมต่อระบบ -->
    <script type="module" src="app.js"></script>
</body>
</html>
